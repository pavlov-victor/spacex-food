# CRM static frontend. Point VITE_CONVEX_URL at the configured Convex deployment.
services:
  - type: web
    name: spacex-food-crm
    runtime: static
    repo: https://github.com/pavlov-victor/spacex-food
    branch: main
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: NODE_VERSION
        value: 24.12.0
      - key: VITE_CONVEX_URL
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
