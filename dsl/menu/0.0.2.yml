            children: null
          warnings:
            type: array[string]
            children: null
          status:
            type: string
            children: null
          schema_version:
            type: string
            children: null
          menu_json:
            type: string
            children: null
        selected: false
      type: custom
      position:
        x: 740
        y: 282
      positionAbsolute:
        x: 740
        y: 282
      width: 242
      height: 130
      selected: false
      sourcePosition: right
      targetPosition: left
    - id: '1789207631355'
      data:
