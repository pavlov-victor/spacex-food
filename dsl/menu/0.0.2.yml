        - variable: schema_version
          value_selector:
          - '1789208000002'
          - schema_version
          value_type: string
        - variable: menu_json
          value_selector:
          - '1789208000002'
          - menu_json
          value_type: string
        selected: false
      type: custom
      position:
        x: 1060
        y: 282
      positionAbsolute:
        x: 1060
        y: 282
      width: 242
      height: 130
      selected: false
      sourcePosition: right
      targetPosition: left
